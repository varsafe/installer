name: installer canary

# CANARY, NOT A RELEASE GATE — deliberately.
#
# This workflow runs in a PUBLIC repository, so anyone with write access here could change what it
# asserts, and the install job downloads and executes whatever varsafe.dev is currently serving. A
# verdict produced under those conditions can be manufactured by someone who controls this repo or
# the CDN, which is precisely the pair a release gate is supposed to protect against. Promotion
# authority stays in the private pipeline, which installs the artifacts it just built, from the
# installer in the tag, verified against the signing key compiled into the CLI.
#
# What this is for: telling us that a release users can reach stopped installing on macOS — a
# machine class the private pipeline cannot run at all — including when nothing of ours changed and
# an OS update moved OpenSSH or LibreSSL under us.
run-name: varsafe ${{ inputs.version || 'latest' }} — macOS canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to install (blank installs whatever latest points at)
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    # A weekly canary. The installer depends on what the OS ships — an OpenSSH or LibreSSL change on
    # macOS can break installs with no commit on our side, and nobody would know until a user tried.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  suite:
    name: test suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon and Intel: the installer picks a different artifact on each, and `varsafe
        # update` must pick the same one. The `macos-13` label was retired in December 2025 and its
        # jobs sit queued forever rather than failing, which left every run permanently pending — a
        # canary that never concludes. `macos-15-intel` is the replacement, and GitHub retires
        # x86_64 macOS entirely after the macOS 15 image (Fall 2027), so this row has a shelf life.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: what this machine actually ships
        run: |
          sw_vers
          uname -m
          echo "openssl: $(openssl version)"
          echo "openssh: $(ssh -V 2>&1)"
          # Expected on stock macOS: LibreSSL (cannot verify Ed25519) + OpenSSH (can, via SSHSIG).
          # If that ever flips, the suite below says so rather than silently changing which path ran.

      - name: installer test suite
        run: bash scripts/test-install-sh.sh

  install:
    name: install from varsafe.dev (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Deliberately no checkout: this job must use exactly what a user gets, from the CDN, with
      # nothing from this repository on disk.
      # A compromised CDN could serve a script that plants a shim answering both checks below, so
      # these prove "a user can install and run it today", never "this release is authentic".
      # Authenticity is established in the private pipeline against the pinned signing key.
      - name: install
        env:
          # Through the environment, never interpolated into the script: a dispatch input is
          # attacker-shaped data as far as this runner is concerned.
          VARSAFE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${VARSAFE_VERSION:-}" ]; then
            echo "installing pinned v${VARSAFE_VERSION}"
          else
            unset VARSAFE_VERSION || true
            echo "installing whatever latest points at"
          fi
          curl -fsSL https://varsafe.dev/install.sh | bash

      - name: it runs, and reports the version that was asked for
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          INSTALLED=$("$HOME/.varsafe/bin/varsafe" --version | tr -d '[:space:]')
          echo "installed: $INSTALLED"
          if [ -n "${EXPECTED:-}" ] && [ "$INSTALLED" != "$EXPECTED" ]; then
            echo "::error::installed $INSTALLED but $EXPECTED was requested"
            exit 1
          fi

      - name: doctor (keychain round-trip)
        run: |
          set -euo pipefail
          # The half no Linux runner can check: the CLI stores its credential key in the OS keychain
          # through a native addon, and a packaging defect there shipped three releases that could
          # not log in.
          "$HOME/.varsafe/bin/varsafe" doctor
